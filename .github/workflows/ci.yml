# 키·모델·네트워크 없이 모의(mock) 레지스트리와 합성 GGUF 로 전체 흐름을 검증한다(Node.js·TypeScript).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # 매주 월요일 — 의존성·런타임이 바뀌어 깨지지 않았는지 정기 확인
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 멈춘 테스트가 기본 6시간을 붙들지 않게(정상 실행은 1분 안쪽)
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DEMO_MODE: mock
      - run: npm run demo -- --lang en
      - run: npm run build
