# Checks every push to main and every pull request with the hermetic unit suite.
# `npm test` compiles TypeScript and runs test/unit with an in-memory mock registry,
# a fake clock and a network guard: no sockets, no real waiting, no internet.
# Real-socket tests (`npm run test:net`) and internet tests (`npm run test:e2e`) run locally only.
# Actions are pinned to full commit SHAs; the comment shows the release tag.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm test
